<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Launchpad MK2 — Adam's Tools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎛️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      user-select: none;
      -webkit-user-select: none;
    }

    .container { max-width: 700px; width: 100%; }

    .back-link {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .back-link:hover { color: #eee; }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    #status {
      color: #aaa;
      margin-bottom: 0.8rem;
      font-size: 0.85rem;
      line-height: 1.5;
      min-height: 2.6em;
    }
    #status span { color: #ccc; font-weight: 500; }

    .launchpad-body {
      background: linear-gradient(180deg, #222 0%, #1a1a1a 100%);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 2px 0 #333, 0 8px 40px rgba(0,0,0,0.5);
      border: 1px solid #2a2a2a;
      width: min(92vw, 560px);
      margin: 0 auto;
    }

    .launchpad-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .logo {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #444;
    }

    .launchpad-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr) 26px;
      grid-template-rows: 26px repeat(8, 1fr);
      gap: 4px;
    }

    .pad {
      background: #2a2a2a;
      border-radius: 4px;
      border: 1px solid #1a1a1a;
      cursor: pointer;
      aspect-ratio: 1;
      touch-action: none;
      position: relative;
    }

    .pad::after {
      content: '';
      position: absolute;
      top: 1px; left: 1px; right: 1px; bottom: 50%;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
      pointer-events: none;
    }

    .pad:active { transform: scale(0.9); }

    .ctrl-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 1px solid #383838;
      cursor: pointer;
      padding: 0;
      touch-action: none;
      place-self: center;
      transition: box-shadow 0.15s;
    }
    .ctrl-btn:hover { background: #383838; }

    .corner { place-self: center; }

    @media (max-width: 480px) {
      body { padding: 0.5rem; }
      h1 { font-size: 1.5rem; }
      .launchpad-body { padding: 10px; border-radius: 12px; }
      .launchpad-grid { gap: 3px; }
      .ctrl-btn { width: 18px; height: 18px; }
      .launchpad-grid {
        grid-template-columns: repeat(8, 1fr) 22px;
        grid-template-rows: 22px repeat(8, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../../index.html" class="back-link">&larr; Back</a>
    <h1>Launchpad MK2</h1>
    <div id="status"></div>
    <div class="launchpad-body">
      <div class="launchpad-header">
        <span class="logo">novation</span>
        <span class="logo" style="font-weight:400;letter-spacing:0.1em;font-size:0.55rem">launchpad mk2</span>
      </div>
      <div id="grid" class="launchpad-grid"></div>
    </div>
  </div>

  <script src="js/launchpad.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
